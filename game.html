<!-- SRY Interactive — 游戏详情页（读取 /api/games 实时数据，按 ?id 显示对应游戏） -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRY Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0c0d0a; --panel:#121310; --panel2:#16170f;
    --line:#2c2e26; --line-soft:#1e1f19;
    --ink:#e7e7df; --ink-dim:#aeb0a6; --ink-faint:#6b6d62; --body:#c6c8bd;
    --accent:#c6f24e; --accent-ink:#0c0d0a;
    --mono:'Space Mono',monospace; --sans:'Archivo',sans-serif; --cjk:'Noto Sans SC',sans-serif; --kr:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  img{display:block;}
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:46px 46px; -webkit-font-smoothing:antialiased; min-height:100vh; }
  body[lang="zh"] .cjk-swap{ font-family:var(--cjk); }
  body[lang="ko"] .cjk-swap{ font-family:var(--kr); }

  .nav{ position:sticky; top:0; z-index:500; display:flex; align-items:center; gap:28px; padding:0 30px; height:62px; background:rgba(12,13,10,.82); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  .brand{ display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .logo{ display:flex; align-items:center; gap:9px; font-family:var(--sans); font-weight:900; font-size:17px; }
  .logo .mark{ width:11px; height:11px; background:var(--accent); display:inline-block; }
  .logo b{ color:var(--ink-dim); font-weight:700; } .logo .hub{ color:#fff; }
  .poweredby{ font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; color:var(--ink-faint); transition:color .15s; padding-left:20px; }
  .poweredby:hover{ color:var(--accent); }
  .nav-links a{ font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:#fff; padding:8px 12px; }
  .nav-links a.active{ color:var(--accent); }
  .nav-spacer{ flex:1; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .lang button{ font-family:var(--mono); font-size:11px; padding:6px 11px; background:transparent; color:var(--ink-dim); border:none; cursor:pointer; }
  .lang button.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
  @media(max-width:560px){ .nav-links{ display:none; } .nav{ gap:14px; padding:0 16px; } }

  .wrap{ max-width:1080px; margin:0 auto; padding:30px 30px 110px; }
  @media(max-width:560px){ .wrap{ padding:22px 16px 80px; } }
  .back{ font-family:var(--mono); font-size:12px; color:var(--ink-dim); margin-bottom:24px; display:inline-block; }
  .back:hover{ color:var(--accent); }

  .state{ padding:60px 0; }
  .state-h{ font-family:var(--sans); font-weight:800; font-size:22px; color:#fff; margin-bottom:8px; }
  .state-p{ font-family:var(--sans); font-size:14px; color:var(--ink-dim); line-height:1.6; }
  .state-load{ font-family:var(--mono); font-size:13px; color:var(--ink-dim); }

  .kicker{ font-family:var(--mono); font-size:12px; letter-spacing:.14em; color:var(--accent); }
  .ptitle{ font-family:var(--sans); font-weight:900; font-size:clamp(30px,4.2vw,48px); line-height:1; letter-spacing:-.025em; color:#fff; text-transform:uppercase; margin:10px 0 14px; }
  /* 可读性：正文换成无衬线、更大更亮 */
  .tagline{ font-family:var(--sans); font-size:16px; color:var(--body); line-height:1.6; max-width:680px; }
  .head-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:16px; }
  .gtag{ font-family:var(--mono); font-size:11px; padding:6px 11px; border:1px solid var(--line); color:var(--ink-dim); background:var(--panel); }

  /* 媒体：限制最大宽高，比例正常 */
  .media{ max-width:840px; margin:28px 0 0; }
  .stage-main{ position:relative; width:100%; aspect-ratio:16/9; max-height:472px; background:#000; border:1px solid var(--line); overflow:hidden; }
  .stage-main img,.stage-main video,.stage-main iframe{ width:100%; height:100%; object-fit:cover; border:none; display:block; }
  .playbtn{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; cursor:pointer; background:rgba(0,0,0,.35); }
  .playbtn .circ{ width:72px;height:72px;border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; }
  .playbtn .tri{ width:0;height:0;border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:22px solid var(--accent-ink); margin-left:5px; }
  .vtag{ position:absolute; top:0; left:0; font-family:var(--mono); font-size:10px; letter-spacing:.1em; background:var(--accent); color:var(--accent-ink); padding:4px 10px; font-weight:700; }
  .thumbs{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .thumb{ width:150px; height:84px; border:1px solid var(--line); overflow:hidden; cursor:pointer; position:relative; flex-shrink:0; opacity:.55; transition:opacity .15s,border-color .15s; background:#1a1a1a; }
  .thumb.on{ opacity:1; border-color:var(--accent); }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb .mini{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.4); }
  .thumb .mini .tri{ width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid #fff; margin-left:2px; }

  .dealsheet{ margin-top:26px; border:1px solid var(--line); background:var(--panel); display:grid; grid-template-columns:1.1fr .9fr 1fr 1.3fr 1fr; }
  .deal-cell{ padding:16px; border-right:1px solid var(--line-soft); display:flex; flex-direction:column; justify-content:center; min-height:82px; }
  .deal-cell:last-child{ border-right:none; }
  .deal-k{ font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; }
  .deal-v{ font-family:var(--sans); font-size:14px; font-weight:600; color:#fff; }
  .deal-seek{ display:flex; flex-wrap:wrap; gap:7px 14px; }
  .seekpill{ font-family:var(--mono); font-size:11px; color:var(--accent); }
  .seekpill::before{ content:"▸ "; }
  .deal-cta{ background:var(--panel2); display:flex; align-items:center; padding:0; }
  .deal-cta a{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; gap:8px; font-family:var(--mono); font-weight:700; font-size:13px; background:var(--accent); color:var(--accent-ink); }
  @media(max-width:860px){ .dealsheet{ grid-template-columns:1fr 1fr; } .deal-cell{ border-right:none; border-bottom:1px solid var(--line-soft); min-height:0; } .deal-cta{ grid-column:1/-1; } .deal-cta a{ padding:14px; } }

  .section-h{ font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin:46px 0 18px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .tracker{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
  .tk-seg{ flex:1; min-width:84px; }
  .tk-bar{ height:5px; background:#23241d; border-radius:1px; transition:all .2s; }
  .tk-bar.fill{ background:var(--accent); }
  .tk-bar.cur{ height:7px; box-shadow:0 0 12px rgba(198,242,78,.55); }
  .tk-label{ font-family:var(--mono); font-size:11px; margin-top:10px; display:block; }
  .tk-now{ font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--accent-ink); background:var(--accent); padding:1px 6px; margin-left:7px; }

  /* 正文 markdown：无衬线、易读 */
  .md-h2{ font-family:var(--sans); font-weight:800; font-size:19px; color:#fff; margin:24px 0 10px; }
  .md-h3{ font-family:var(--sans); font-weight:700; font-size:15px; color:var(--ink); margin:18px 0 8px; }
  .md-p{ font-family:var(--sans); font-size:15px; color:var(--body); line-height:1.75; margin-bottom:6px; }
  .md-p strong{ color:#fff; font-weight:700; }
  .md-img{ width:100%; border:1px solid var(--line); margin:16px 0; }
  .md-sp{ height:10px; }
  .overview{ max-width:760px; }

  .studio{ border:1px solid var(--line); background:var(--panel); padding:20px; display:flex; gap:16px; align-items:flex-start; max-width:760px; }
  .studio-logo{ width:54px; height:54px; flex-shrink:0; border:1px solid var(--line); background:#1a1a1a; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .studio-logo img{ width:100%; height:100%; object-fit:cover; }
  .studio-name{ font-family:var(--sans); font-weight:800; font-size:17px; color:#fff; margin-bottom:6px; }
  .studio-desc{ font-family:var(--sans); font-size:14px; color:var(--ink-dim); line-height:1.7; }

  .cta-band{ margin-top:46px; border:1px solid var(--accent); background:linear-gradient(180deg,rgba(198,242,78,.06),transparent); padding:26px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .cta-band h3{ font-family:var(--sans); font-weight:800; font-size:20px; color:#fff; }
  .cta-band p{ font-family:var(--sans); font-size:14px; color:var(--ink-dim); margin-top:6px; max-width:520px; line-height:1.6; }
  .cta-band a{ font-family:var(--mono); font-weight:700; font-size:13px; background:var(--accent); color:var(--accent-ink); padding:13px 22px; white-space:nowrap; }
</style>

<nav class="nav">
  <div class="brand">
    <a class="logo" href="/"><span class="mark"></span><b>SRY</b> <span class="hub">GAME HUB</span></a>
    <a class="poweredby" href="https://sryinteractive.com" target="_blank" rel="noopener" data-en="powered by SRY Interactive ↗" data-zh="由 SRY Interactive 出品 ↗" data-ko="SRY Interactive 제공 ↗">powered by SRY Interactive ↗</a>
  </div>
  <div class="nav-links"><a href="/" class="active" data-en="Projects" data-zh="项目" data-ko="프로젝트">Projects</a></div>
  <div class="nav-spacer"></div>
  <div class="lang" id="lang"><button data-l="en" class="on">EN</button><button data-l="zh">中文</button><button data-l="ko">한국어</button></div>
</nav>

<div class="wrap"><div id="app"></div></div>

<script>
const SUBMIT="https://z5gxmjtpe7.feishu.cn/share/base/form/shrcnMt1EytDgy79CO7mgbrkIed"; // 提交游戏表单（飞书）
const CONTACT_DOMAIN="srygamehub.com"; // 项目专属邮箱域名（Cloudflare Email Routing 兜底转发）
const ZH={
  genre:{Action:"动作",Adventure:"冒险",RPG:"角色扮演",Strategy:"策略",Simulation:"模拟",Puzzle:"解谜",Platformer:"平台",Shooter:"射击",Survival:"生存",Horror:"恐怖",Roguelite:"Roguelite",Metroidvania:"银河恶魔城","Souls-like":"类魂","Visual Novel":"视觉小说","Card Game":"卡牌","Open World":"开放世界",Narrative:"叙事",Comedy:"喜剧","Co-op":"合作",Multiplayer:"多人"},
  need:{"Seeking Publisher":"寻找发行","Seeking Publisher Partner":"寻找联合发行","Seeking Investment":"寻找投资"},
  stage:{"In Development":"开发中",Demo:"Demo",Playtest:"Playtest","Early Access":"EA",Released:"发布"},
  platform:{PC:"PC",Console:"主机",Mobile:"移动端"},
  region:{Global:"全球",China:"中国",Overseas:"海外"}
};
const KO={
  genre:{Action:"액션",Adventure:"어드벤처",RPG:"RPG",Strategy:"전략",Simulation:"시뮬레이션",Puzzle:"퍼즐",Platformer:"플랫포머",Shooter:"슈팅",Survival:"생존",Horror:"호러",Roguelite:"로그라이트",Metroidvania:"메트로배니아","Souls-like":"소울라이크","Visual Novel":"비주얼 노벨","Card Game":"카드 게임","Open World":"오픈 월드",Narrative:"내러티브",Comedy:"코미디","Co-op":"협동",Multiplayer:"멀티플레이어"},
  need:{"Seeking Publisher":"퍼블리셔 모집","Seeking Publisher Partner":"공동 퍼블리셔 모집","Seeking Investment":"투자 유치"},
  stage:{"In Development":"개발 중",Demo:"데모",Playtest:"플레이테스트","Early Access":"얼리 액세스",Released:"출시"},
  platform:{PC:"PC",Console:"콘솔",Mobile:"모바일"},
  region:{Global:"글로벌",China:"중국",Overseas:"해외"}
};
const T={
  en:{back:"← All Projects",developer:"Developer",platform:"Platform",market:"Target Market",seeking:"Seeking",overview:"Project Overview",studio:"Studio",stage:"Stage",contact:"Contact Developer ↗",ctaH:"Interested in this project?",ctaP:"Reach out to the team directly to request the full pitch deck, build access, or partnership terms.",ctaBtn:"Contact Developer ↗",trailer:"TRAILER",na:"—",loading:"Loading…",nfH:"Project not found",nfP:"This project may have been moved, unlisted, or the link is incorrect."},
  zh:{back:"← 返回项目列表",developer:"开发商",platform:"平台",market:"目标市场",seeking:"寻求合作",overview:"项目概览",studio:"开发团队",stage:"进展",contact:"联系开发团队 ↗",ctaH:"对这个项目感兴趣？",ctaP:"直接联系开发团队，获取完整项目资料、试玩版本或合作条款。",ctaBtn:"联系开发团队 ↗",trailer:"预告片",na:"—",loading:"加载中…",nfH:"未找到该项目",nfP:"该项目可能已下架、未上架，或链接有误。"},
  ko:{back:"← 전체 프로젝트",developer:"개발사",platform:"플랫폼",market:"타겟 시장",seeking:"모집",overview:"프로젝트 개요",studio:"스튜디오",stage:"단계",contact:"개발팀에 문의 ↗",ctaH:"이 프로젝트에 관심 있으신가요?",ctaP:"전체 피치 자료, 빌드 액세스, 파트너십 조건은 개발팀에 직접 문의해 주세요.",ctaBtn:"개발팀에 문의 ↗",trailer:"트레일러",na:"—",loading:"불러오는 중…",nfH:"프로젝트를 찾을 수 없습니다",nfP:"이 프로젝트는 이동되었거나 목록에서 제외되었거나 링크가 잘못되었을 수 있습니다."}
};
const STAGES=["In Development","Demo","Playtest","Early Access","Released"];

let lang="en", GAME=null, media=[], activeIdx=0, playing=false;
const $=s=>document.querySelector(s);
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const L=(c,v)=> lang==="zh"?((ZH[c]&&ZH[c][v])||v):lang==="ko"?((KO[c]&&KO[c][v])||v):v;
const FB={en:['en','zh','ko'],zh:['zh','en','ko'],ko:['ko','en','zh']};
const field=(g,base)=>{ for(const l of FB[lang]){ const val=g[base+'_'+l]; if(val&&String(val).trim()) return val; } return ""; };
function slugify(s){ return (s||"").toLowerCase().trim().replace(/['']/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function contactHref(g){
  const slug=slugify((g&&(g.t_en||g.t_zh))||"");
  if(!slug) return SUBMIT;
  const name=(g.t_en||g.t_zh||"").trim();
  const subject=encodeURIComponent(`[${name}] Partnership Inquiry — via SRY Game Hub`);
  const bodyTxt=encodeURIComponent(`Hi ${ (g.developer||"team") },\n\nI found ${name} on SRY Game Hub and would like to discuss a potential partnership.\n\n`);
  return `mailto:${slug}@${CONTACT_DOMAIN}?subject=${subject}&body=${bodyTxt}`;
}
function videoEmbed(u){ if(!u) return null;
  let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]+)/); if(m) return {type:"iframe",src:`https://www.youtube.com/embed/${m[1]}?autoplay=1`};
  m=u.match(/bilibili\.com\/video\/(BV[\w]+)/); if(m) return {type:"iframe",src:`https://player.bilibili.com/player.html?bvid=${m[1]}&autoplay=1`};
  if(/\.(mp4|webm|mov)(\?.*)?$/i.test(u)) return {type:"video",src:u}; return {type:"iframe",src:u}; }
function mdToHtml(t){ if(!t) return ""; let o="";
  for(const line of t.split(/\r?\n/)){
    const im=line.match(/^!\[([^\]]*)\]\(([^)]+)\)\s*$/); if(im){o+=`<img class="md-img" src="${im[2]}">`;continue;}
    if(line.startsWith("## ")){o+=`<div class="md-h2">${esc(line.slice(3))}</div>`;continue;}
    if(line.startsWith("### ")){o+=`<div class="md-h3">${esc(line.slice(4))}</div>`;continue;}
    if(line.trim()===""){o+=`<div class="md-sp"></div>`;continue;}
    o+=`<div class="md-p">${esc(line).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")}</div>`;
  } return o; }
function buildMedia(g){ const a=[]; const ve=videoEmbed(g.video);
  if(ve) a.push({kind:"video",embed:ve,thumb:g.cover||(g.screenshots&&g.screenshots[0])||""});
  (g.screenshots||[]).forEach(s=>{ if(s&&s.trim()) a.push({kind:"image",src:s.trim()}); });
  if(!a.length&&g.cover) a.push({kind:"image",src:g.cover}); return a; }
function renderMain(){ const m=media[activeIdx]; if(!m) return `<div class="stage-main"></div>`;
  if(m.kind==="video"){ if(playing){ return m.embed.type==="video"?`<div class="stage-main"><video src="${m.embed.src}" controls autoplay></video></div>`:`<div class="stage-main"><iframe src="${m.embed.src}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`; }
    return `<div class="stage-main"><span class="vtag">${T[lang].trailer}</span>${m.thumb?`<img src="${m.thumb}">`:''}<div class="playbtn" id="pb"><div class="circ"><div class="tri"></div></div></div></div>`; }
  return `<div class="stage-main"><img src="${m.src}"></div>`; }
function renderThumbs(){ if(media.length<2) return ""; return `<div class="thumbs">`+media.map((m,i)=>`<div class="thumb ${i===activeIdx?'on':''}" data-i="${i}">${m.kind==="video"?`${m.thumb?`<img src="${m.thumb}">`:''}<div class="mini"><div class="tri"></div></div>`:`<img src="${m.src}">`}</div>`).join("")+`</div>`; }
function renderTracker(g){ const cur=STAGES.indexOf(g.stage); let h=`<div class="tracker">`;
  STAGES.forEach((s,i)=>{ const isCur=i===cur, filled=i<=cur && cur>=0;
    const col=isCur?"var(--accent)":(i<cur?"var(--ink-dim)":"var(--ink-faint)");
    h+=`<div class="tk-seg"><div class="tk-bar ${filled?'fill':''} ${isCur?'cur':''}"></div><span class="tk-label" style="color:${col};font-weight:${isCur?700:400}">${L('stage',s)}${isCur?`<span class="tk-now">${lang==='zh'?'当前':lang==='ko'?'현재':'NOW'}</span>`:''}</span></div>`; });
  return h+`</div>`; }

function renderLoading(){ document.body.setAttribute("lang",lang); $("#app").innerHTML=`<div class="state state-load">${T[lang].loading}</div>`; }
function renderNotFound(){ document.body.setAttribute("lang",lang); document.title="SRY Game Hub";
  $("#app").innerHTML=`<a class="back" href="/">${T[lang].back}</a><div class="state"><div class="state-h cjk-swap">${T[lang].nfH}</div><div class="state-p cjk-swap">${T[lang].nfP}</div></div>`; }

function render(){ if(!GAME){ renderNotFound(); return; }
  const g=GAME,t=T[lang]; document.body.setAttribute("lang",lang);
  const title=field(g,'t'); document.title=(title?title+" — ":"")+"SRY Game Hub";
  const tag=field(g,'d');
  const full=mdToHtml(field(g,'full'));
  const sd=field(g,'studio');
  const ch=contactHref(g); const ext=/^https?:/i.test(ch)?' target="_blank" rel="noopener"':'';
  const hasStudio=(g.developer&&g.developer.trim())||(sd&&sd.trim());
  const genres=g.genres||[], needs=g.needs||[], platforms=g.platforms||[];
  $("#app").innerHTML=`
    <a class="back" href="/">${t.back}</a>
    <div class="kicker">SRY GAME HUB // DEVELOPER × PUBLISHER</div>
    <h1 class="ptitle cjk-swap">${esc(title)}</h1>
    ${tag?`<p class="tagline cjk-swap">${esc(tag)}</p>`:''}
    ${genres.length?`<div class="head-chips">${genres.map(x=>`<span class="gtag">${L('genre',x)}</span>`).join("")}</div>`:''}

    <div class="media"><div id="mainview">${renderMain()}</div><div id="thumbview">${renderThumbs()}</div></div>

    <div class="dealsheet">
      <div class="deal-cell"><div class="deal-k">${t.developer}</div><div class="deal-v cjk-swap">${esc(g.developer)||t.na}</div></div>
      <div class="deal-cell"><div class="deal-k">${t.platform}</div><div class="deal-v">${platforms.length?platforms.map(p=>L('platform',p)).join(" · "):t.na}</div></div>
      <div class="deal-cell"><div class="deal-k">${t.market}</div><div class="deal-v">${g.region?L('region',g.region):t.na}</div></div>
      <div class="deal-cell"><div class="deal-k">${t.seeking}</div>${needs.length?`<div class="deal-seek">${needs.map(n=>`<span class="seekpill">${L('need',n)}</span>`).join("")}</div>`:`<div class="deal-v">${t.na}</div>`}</div>
      <div class="deal-cell deal-cta"><a href="${ch}"${ext}>${t.contact}</a></div>
    </div>

    ${g.stage?`<div class="section-h">${t.stage}</div>${renderTracker(g)}`:''}

    ${full?`<div class="section-h">${t.overview}</div><div class="overview cjk-swap">${full}</div>`:''}

    ${hasStudio?`<div class="section-h">${t.studio}</div>
    <div class="studio">
      ${g.studioLogo?`<div class="studio-logo"><img src="${esc(g.studioLogo)}"></div>`:''}
      <div><div class="studio-name cjk-swap">${esc(g.developer||'')}</div><div class="studio-desc cjk-swap">${esc(sd)}</div></div>
    </div>`:''}

    <div class="cta-band">
      <div><h3 class="cjk-swap">${t.ctaH}</h3><p class="cjk-swap">${t.ctaP}</p></div>
      <a href="${ch}"${ext}>${t.ctaBtn}</a>
    </div>`;
  bindPb();
  document.querySelectorAll(".thumb").forEach(el=>el.addEventListener("click",()=>{activeIdx=+el.dataset.i;playing=false;$("#mainview").innerHTML=renderMain();document.querySelectorAll(".thumb").forEach(x=>x.classList.toggle("on",+x.dataset.i===activeIdx));bindPb();}));
}
function bindPb(){ const pb=$("#pb"); if(pb) pb.addEventListener("click",()=>{playing=true;$("#mainview").innerHTML=renderMain();bindPb();}); }

$("#lang").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#lang button").forEach(x=>x.classList.remove("on"));b.classList.add("on");lang=b.dataset.l;document.querySelectorAll(".nav [data-en]").forEach(el=>el.textContent=el.getAttribute("data-"+lang));render();});

(async function(){
  renderLoading();
  const id=(new URLSearchParams(location.search).get("id")||"").toLowerCase();
  try{
    const res=await fetch("/api/games");
    const data=await res.json();
    if(!Array.isArray(data)) throw new Error("bad payload");
    GAME = data.find(g=>slugify(g.t_en)===id) || data.find(g=>slugify(g.t_zh)===id) || null;
  }catch(err){ GAME=null; }
  media = GAME?buildMedia(GAME):[];
  render();
})();
</script>
