<style>
  :root{
    --bg:#0c0d0a; --panel:#121310; --panel2:#16170f;
    --line:#2c2e26; --line-soft:#1e1f19;
    --ink:#e7e7df; --ink-dim:#9a9b92; --ink-faint:#6b6d62;
    --accent:#c6f24e; --accent-ink:#0c0d0a; --danger:#f26d5b;
    --mono:'Space Mono',monospace; --sans:'Archivo',sans-serif; --cjk:'Noto Sans SC',sans-serif; --kr:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:46px 46px; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  body[lang="zh"] .cjk-swap{ font-family:var(--cjk); }
  body[lang="ko"] .cjk-swap{ font-family:var(--kr); }

  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line-soft); }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:900; font-size:17px; letter-spacing:-.01em; }
  .logo .mark{ width:11px; height:11px; background:var(--accent); display:inline-block; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .lang button{ font-family:var(--mono); font-size:11px; padding:6px 11px; background:transparent; color:var(--ink-dim); border:none; cursor:pointer; }
  .lang button.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }

  .wrap{ max-width:560px; margin:0 auto; padding:48px 20px 90px; }
  .kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); margin-bottom:10px; }
  h1{ font-size:28px; font-weight:900; letter-spacing:-.02em; margin-bottom:8px; }
  .lead{ color:var(--ink-dim); font-size:13.5px; line-height:1.6; margin-bottom:26px; }
  .statusbar{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:8px 12px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:22px; color:var(--ink-dim); display:none; }
  .statusbar b{ color:var(--accent); font-weight:700; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:26px 22px; display:none; }
  .f{ margin-bottom:20px; }
  label{ display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 8px; }
  label .req{ color:var(--accent); }
  input[type=text], input[type=email], input[type=url], select, textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-size:14px; padding:11px 13px; outline:none; transition:border .15s; font-family:inherit;
  }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ min-height:96px; resize:vertical; line-height:1.6; }
  select{ appearance:none; }
  .cnt{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-align:right; margin-top:4px; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border:1px solid var(--line); border-radius:20px;
    background:transparent; color:var(--ink-dim); cursor:pointer; transition:all .12s; }
  .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

  .up{ display:flex; align-items:center; gap:14px; }
  .up .preview{ width:76px; height:76px; border:1px dashed var(--line); border-radius:10px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; color:var(--ink-faint); font-size:22px; }
  .up .preview img{ width:100%; height:100%; object-fit:cover; }
  .up .meta{ flex:1; }
  .upbtn{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:8px 14px; border:1px solid var(--line);
    border-radius:7px; background:transparent; color:var(--ink); cursor:pointer; }
  .upbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .upnote{ font-size:11px; color:var(--ink-faint); margin-top:7px; line-height:1.5; }

  .btn{ width:100%; margin-top:6px; padding:13px 0; border:none; border-radius:8px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-family:var(--mono); font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .msg{ font-size:12.5px; margin-top:12px; line-height:1.5; display:none; }
  .msg.err{ display:block; color:var(--danger); }
  .msg.ok{ display:block; color:var(--accent); }
  .back{ display:inline-block; margin-top:22px; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink-dim); }
  .back:hover{ color:var(--accent); }
  .locked{ text-align:center; padding:34px 10px; display:none; }
  .locked .big{ font-size:34px; margin-bottom:12px; }
  .locked p{ color:var(--ink-dim); font-size:13.5px; line-height:1.7; }
  .locked a{ color:var(--accent); }
</style>

  <a class="logo" href="/"><span class="mark"></span>SRY GAME HUB</a>

    <div class="f"><label><span id="p4"></span> <span class="req">*</span></label>

      </div>

let lang = localStorage.getItem("sry_lang") || "en";
let role = "", status = "";
let devProofUrl = "", parProofUrl = "", parLogoUrl = "";
let selKinds = [], selGenres = [], selMarkets = [];

function T(){ return I18N[lang]; }
function err(el,key){ el.className="msg err"; el.textContent = T().errors[key] || T().errors.server; }
function ok(el,text){ el.className="msg ok"; el.textContent = text; }
function clearMsg(el){ el.className="msg"; el.textContent=""; }

async function api(path, opts){
  const res = await fetch("/api/profile/"+path, opts);
  let data=null; try{ data=await res.json(); }catch{}
  if(!data) throw "network";
  if(!data.ok) throw (data.error||"server").split(":")[0].trim();
  return data;
}

function chips(el, list, labels, selected, single){
  el.innerHTML = "";
  list.forEach(v=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(selected.includes(v)?" on":""); b.textContent=labels[lang][v]||v;
    b.onclick=()=>{
      const i=selected.indexOf(v);
      if(i>=0) selected.splice(i,1); else { if(single) selected.length=0; selected.push(v); }
      chips(el,list,labels,selected,single);
    };
    el.appendChild(b);
  });
}

function fillSelect(el, list, labels){
  const cur = el.value;
  el.innerHTML = "";
  list.forEach(v=>{
    const o=document.createElement("option"); o.value=v; o.textContent=labels[lang][v]||v; el.appendChild(o);
  });
  if(list.includes(cur)) el.value=cur;
}

function bindUpload(fileEl, btnEl, prevEl, kind, onDone, msgEl){
  btnEl.onclick = ()=>fileEl.click();
  fileEl.onchange = async ()=>{
    const f = fileEl.files[0]; if(!f) return;
    clearMsg(msgEl);
    if(f.size > 5*1024*1024){ err(msgEl,"too_large"); fileEl.value=""; return; }
    btnEl.disabled=true; btnEl.textContent=T().uploading;
    try{
      const fd = new FormData(); fd.append("file", f); fd.append("kind", kind);
      const d = await api("upload",{ method:"POST", body:fd });
      onDone(d.url);
      prevEl.innerHTML = `<img src="${d.url}" alt="">`;
    }catch(e){ err(msgEl,e); }
    finally{ btnEl.disabled=false; btnEl.textContent=T().upload; fileEl.value=""; }
  };
}

function renderText(){
  document.body.setAttribute("lang",lang);
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const t=T();
  $("#title").textContent = role==="partner" ? t.titlePar : t.titleDev;
  $("#lead").textContent = t.lead;
  $("#back").textContent = t.back;
  $("#locked-text").innerHTML = t.locked;
  if(status){ $("#statusbar").style.display="block"; $("#statusbar").innerHTML = t.status(status); }
  // 开发者
  $("#d1").textContent=t.d1; $("#d2").textContent=t.d2; $("#d2n").textContent=t.d2n;
  $("#d3").textContent=t.d3; $("#d4").textContent=t.d4; $("#d4n").textContent=t.d4n;
  $("#dev-upbtn").textContent=t.upload; $("#dev-save").textContent=t.save;
  fillSelect($("#dev-prooftype"), DEV_PROOF, DEV_PROOF_L);
  // 合作方
  ["p1","p2","p2n","p3","p4","p5","p6","p7","p8","p9","p10","p10n","p11","p12","p12n"].forEach(k=>{ $("#"+k).textContent=t[k]; });
  $("#par-logobtn").textContent=t.upload; $("#par-upbtn").textContent=t.upload; $("#par-save").textContent=t.save;
  fillSelect($("#par-region"), REGIONS, REGION_L);
  fillSelect($("#par-prooftype"), PARTNER_PROOF, PARTNER_PROOF_L);
  chips($("#par-kinds"), KINDS, KIND_L, selKinds);
  chips($("#par-genres"), GENRES, GENRE_L, selGenres);
  chips($("#par-markets"), MARKETS, MARKET_L, selMarkets);
}

$("#dev-save").onclick = async ()=>{
  const t=T(), m=$("#dev-msg"); clearMsg(m);
  $("#dev-save").disabled=true; $("#dev-save").textContent=t.saving;
  try{
    await api("save",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        studio_name:$("#dev-studio").value, contact_email:$("#dev-email").value,
        proof_type:$("#dev-prooftype").value, proof_image:devProofUrl
      })});
    status="pending"; renderText(); ok(m, t.saved);
  }catch(e){ err(m,e); }
  finally{ $("#dev-save").disabled=false; $("#dev-save").textContent=t.save; }
};

$("#par-save").onclick = async ()=>{
  const t=T(), m=$("#par-msg"); clearMsg(m);
  $("#par-save").disabled=true; $("#par-save").textContent=t.saving;
  try{
    await api("save",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        name_en:$("#par-name-en").value, name_zh:$("#par-name-zh").value, logo:parLogoUrl,
        kinds:selKinds, region:$("#par-region").value, intro:$("#par-intro").value,
        genres:selGenres, markets:selMarkets,
        steam_url:$("#par-steam").value.trim(), website:$("#par-web").value.trim(),
        contact_email:$("#par-email").value, proof_type:$("#par-prooftype").value, proof_image:parProofUrl
      })});
    status="pending"; renderText(); ok(m, t.saved);
  }catch(e){ err(m,e); }
  finally{ $("#par-save").disabled=false; $("#par-save").textContent=t.save; }
};

$("#par-intro").addEventListener("input",()=>{ $("#par-introcnt").textContent=$("#par-intro").value.length; });
$("#lang").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; localStorage.setItem("sry_lang",lang); renderText();
});

bindUpload($("#dev-file"), $("#dev-upbtn"), $("#dev-preview"), "proof", (u)=>{devProofUrl=u;}, $("#dev-msg"));
bindUpload($("#par-file"), $("#par-upbtn"), $("#par-preview"), "proof", (u)=>{parProofUrl=u;}, $("#par-msg"));
bindUpload($("#par-logofile"), $("#par-logobtn"), $("#par-logoprev"), "logo", (u)=>{parLogoUrl=u;}, $("#par-msg"));

(async ()=>{
  renderText();
  try{
    const d = await api("me",{method:"GET"});
    role = d.role; status = d.status;
    const p = d.profile || {};
    if(role==="developer"){
      $("#f-dev").style.display="block";
      $("#dev-studio").value=p.studio_name||""; $("#dev-email").value=p.contact_email||"";
      if(p.proof_type) $("#dev-prooftype").value=p.proof_type;
      if(p.proof_image){ devProofUrl=p.proof_image; $("#dev-preview").innerHTML=`<img src="${p.proof_image}">`; }
    }else{
      $("#f-par").style.display="block";
      $("#par-name-en").value=p.name_en||""; $("#par-name-zh").value=p.name_zh||"";
      selKinds = Array.isArray(p.kinds)?p.kinds.filter(k=>KINDS.includes(k)):[];
      if(p.region) $("#par-region").value=p.region;
      $("#par-intro").value=p.intro||""; $("#par-introcnt").textContent=($("#par-intro").value.length);
      selGenres = Array.isArray(p.genres)?p.genres.filter(g=>GENRES.includes(g)):[];
      selMarkets = Array.isArray(p.markets)?p.markets.filter(m=>MARKETS.includes(m)):[];
      $("#par-steam").value=p.steam_url||""; $("#par-web").value=p.website||"";
      $("#par-email").value=p.contact_email||"";
      if(p.proof_type) $("#par-prooftype").value=p.proof_type;
      if(p.proof_image){ parProofUrl=p.proof_image; $("#par-preview").innerHTML=`<img src="${p.proof_image}">`; }
      if(p.logo){ parLogoUrl=p.logo; $("#par-logoprev").innerHTML=`<img src="${p.logo}">`; }
    }
    renderText();
  }catch(e){
    $("#locked").style.display="block";
  }
})();
</script>
