<!-- SRY Game Hub — 资料填写页 v2(开发者/合作方) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile · SRY Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0c0d0a; --panel:#121310; --panel2:#16170f;
    --line:#2c2e26; --line-soft:#1e1f19;
    --ink:#e7e7df; --ink-dim:#9a9b92; --ink-faint:#6b6d62;
    --accent:#c6f24e; --accent-ink:#0c0d0a; --danger:#f26d5b;
    --mono:'Space Mono',monospace; --sans:'Archivo',sans-serif; --cjk:'Noto Sans SC',sans-serif; --kr:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:46px 46px; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  body[lang="zh"] .cjk-swap{ font-family:var(--cjk); }
  body[lang="ko"] .cjk-swap{ font-family:var(--kr); }

  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line-soft); }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:900; font-size:17px; letter-spacing:-.01em; }
  .logo .mark{ width:11px; height:11px; background:var(--accent); display:inline-block; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .lang button{ font-family:var(--mono); font-size:11px; padding:6px 11px; background:transparent; color:var(--ink-dim); border:none; cursor:pointer; }
  .lang button.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }

  .wrap{ max-width:600px; margin:0 auto; padding:48px 20px 90px; }
  .kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); margin-bottom:10px; }
  h1{ font-size:28px; font-weight:900; letter-spacing:-.02em; margin-bottom:8px; }
  .lead{ color:var(--ink-dim); font-size:13.5px; line-height:1.6; margin-bottom:24px; }
  .statusbar{ font-family:var(--mono); font-size:11px; letter-spacing:.08em; padding:8px 12px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:22px; color:var(--ink-dim); display:none; }
  .statusbar b{ color:var(--accent); font-weight:700; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 24px 26px; display:none; }

  /* 分区标题 */
  .sec{ display:flex; align-items:center; gap:12px; margin:30px 0 20px; }
  .sec .num{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent-ink); background:var(--accent);
    padding:3px 8px; border-radius:4px; letter-spacing:.06em; }
  .sec .st{ font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink); }
  .sec .rule{ flex:1; height:1px; background:var(--line-soft); }

  /* 题号:每个字段自动编号,漏填一眼可见 */
  .card{ counter-reset:q; }
  .f{ margin-bottom:28px; }
  .f > label{ color:var(--ink); display:flex; align-items:baseline; gap:9px; font-size:14px; font-weight:800; margin:0 0 5px; }
  .f > label::before{ counter-increment:q; content:counter(q,decimal-leading-zero);
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--accent);
    border:1px solid var(--accent); border-radius:4px; padding:2px 6px; flex:none; }
  label{ display:block; font-size:13px; font-weight:700; color:var(--ink); margin:0 0 4px; }
  label .req{ color:var(--accent); }
  label .multi{ font-family:var(--mono); font-size:10px; font-weight:400; color:var(--ink-faint); letter-spacing:.05em; margin-left:6px; }
  .sub{ font-size:11.5px; color:var(--ink-faint); line-height:1.55; margin:0 0 9px; }
  input[type=text], input[type=email], input[type=url], select, textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-size:14px; padding:11px 13px; outline:none; transition:border .15s; font-family:inherit;
  }
  input::placeholder, textarea::placeholder{ color:var(--ink-faint); }
  input:focus, select:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ min-height:86px; resize:vertical; line-height:1.6; }
  select{ appearance:none; }
  .cnt{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-align:right; margin-top:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border:1px solid var(--line); border-radius:20px;
    background:transparent; color:var(--ink-dim); cursor:pointer; transition:all .12s; }
  .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

  /* 国家/地区可搜索下拉 */
  .combo{ position:relative; }
  .combo .list{ position:absolute; z-index:30; left:0; right:0; top:calc(100% + 4px); max-height:240px; overflow:auto;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; display:none; }
  .combo .list.open{ display:block; }
  .combo .item{ padding:9px 13px; font-size:13.5px; cursor:pointer; display:flex; gap:9px; align-items:center; }
  .combo .item:hover{ background:rgba(198,242,78,.09); }
  .combo .item .flag{ font-size:16px; }

  .logopick{ display:flex; gap:12px; flex-wrap:wrap; }
  .lp{ display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .lp .pic{ width:64px; height:64px; border-radius:11px; border:2px solid var(--line); background:var(--panel2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; transition:border .15s; }
  .lp .pic img, .lp .pic svg{ width:100%; height:100%; object-fit:cover; }
  .lp.sel .pic{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .lp .cap{ font-family:var(--mono); font-size:9.5px; letter-spacing:.04em; color:var(--ink-faint); text-align:center; }
  .lp.sel .cap{ color:var(--accent); }
  .lp .pic.up{ color:var(--ink-faint); font-size:20px; flex-direction:column; }
  .lp .pic.up .u2{ font-family:var(--mono); font-size:8px; margin-top:2px; }
  .up{ display:flex; align-items:center; gap:14px; }
  .up .preview{ width:76px; height:76px; border:1px dashed var(--line); border-radius:10px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; color:var(--ink-faint); font-size:22px; }
  .up .preview img{ width:100%; height:100%; object-fit:cover; }
  .upbtn{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:8px 14px; border:1px solid var(--line);
    border-radius:7px; background:transparent; color:var(--ink); cursor:pointer; }
  .upbtn:hover{ border-color:var(--accent); color:var(--accent); }

  /* 企业邮箱验证块 */
  .vbox{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:16px 14px; }
  .vrow{ display:flex; gap:8px; margin-top:8px; }
  .vrow input{ flex:1; }
  .vbtn{ font-family:var(--mono); font-size:11px; letter-spacing:.05em; padding:0 16px; border:1px solid var(--line);
    border-radius:8px; background:transparent; color:var(--ink); cursor:pointer; white-space:nowrap; }
  .vbtn:hover{ border-color:var(--accent); color:var(--accent); }
  .vbtn:disabled{ opacity:.45; cursor:default; }
  .vbadge{ display:none; align-items:center; gap:8px; font-family:var(--mono); font-size:12px; color:var(--accent);
    border:1px solid var(--accent); border-radius:8px; padding:10px 12px; margin-top:10px; }
  .vbadge.on{ display:flex; }

  .btn{ width:100%; margin-top:8px; padding:14px 0; border:none; border-radius:8px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-family:var(--mono); font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .msg{ font-size:12.5px; margin-top:12px; line-height:1.5; display:none; }
  .msg.err{ display:block; color:var(--danger); }
  .msg.ok{ display:block; color:var(--accent); }
  .smsg{ font-size:11.5px; margin-top:8px; display:none; }
  .smsg.err{ display:block; color:var(--danger); }
  .smsg.ok{ display:block; color:var(--accent); }
  .back{ display:inline-block; margin-top:22px; font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; color:var(--ink-dim); }
  .back:hover{ color:var(--accent); }
  .locked{ text-align:center; padding:34px 10px; display:none; }
  .locked .big{ font-size:34px; margin-bottom:12px; }
  .locked p{ color:var(--ink-dim); font-size:13.5px; line-height:1.7; }
  .locked a{ color:var(--accent); }
</style>

<nav class="nav">
  <a class="logo" href="/"><span class="mark"></span>SRY GAME HUB</a>
  <div class="lang" id="lang">

<div class="wrap">

      <input type="text" id="dev-studio" maxlength="120"></div>

      <textarea id="dev-intro" maxlength="200" style="min-height:72px"></textarea>

    <button class="btn" id="dev-save"></button>

  <!-- ================= 合作方表单 ================= -->

      <p class="sub cjk-swap" id="p1n"></p>

      <div class="row2" style="margin-top:8px">
        <input type="text" id="par-name-zh" maxlength="120">
        <input type="text" id="par-name-ko" maxlength="120">

        <div><button class="upbtn" id="par-logobtn" type="button"></button></div>
      </div>
      <input type="file" id="par-logofile" accept="image/jpeg,image/png,image/webp" hidden></div>
    <div class="f"><label><span id="p4"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="p4n"></p>
      <div class="combo">
        <input type="text" id="par-region" autocomplete="off">
        <div class="list" id="region-list"></div>
      </div></div>

    <div class="sec"><span class="num">02</span><span class="st" id="psec2"></span><span class="rule"></span></div>
    <div class="f"><label><span id="p3"></span> <span class="req">*</span><span class="multi" id="p3m"></span></label>
      <div class="chips" id="par-kinds"></div></div>
    <div class="f"><label><span id="p5"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="p5n"></p>
      <textarea id="par-intro" maxlength="600"></textarea>
      <div class="cnt"><span id="par-introcnt">0</span>/600</div></div>
    <div class="f"><label><span id="p6"></span><span class="multi" id="p6m"></span></label>
      <div class="chips" id="par-genres"></div></div>
    <div class="f"><label><span id="p7"></span> <span class="req">*</span><span class="multi" id="p7m"></span></label>
      <div class="chips" id="par-markets"></div></div>

    <div class="sec"><span class="num">03</span><span class="st" id="psec3"></span><span class="rule"></span></div>
    <div class="f"><label id="p8"></label>
      <input type="url" id="par-steam" placeholder="https://store.steampowered.com/publisher/..."></div>
    <div class="f"><label id="p9"></label>
      <input type="url" id="par-web" placeholder="https://..."></div>
    <div class="f"><label><span id="p10"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="p10n"></p>
      <input type="email" id="par-email"></div>

    <div class="sec"><span class="num">04</span><span class="st" id="psec4"></span><span class="rule"></span></div>
    <div class="f"><label><span id="p11"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="p11n"></p>
      <select id="par-prooftype"></select></div>

    <!-- 方式 A:企业邮箱验证 -->
    <div class="f" id="p-workmail" style="display:none">
      <div class="vbox">
        <label style="margin-bottom:2px"><span id="pw1"></span></label>
        <p class="sub cjk-swap" id="pw1n"></p>
        <div class="vrow">
          <input type="email" id="work-email">
          <button class="vbtn" id="work-send" type="button"></button>
        </div>
        <div class="vrow" id="work-coderow" style="display:none">

<script>
const GENRES = ["Action","Adventure","RPG","Strategy","Simulation","Puzzle","Platformer","Shooter","Survival","Horror","Roguelite","Metroidvania","Souls-like","Visual Novel","Card Game","Open World","Narrative","Comedy","Co-op","Multiplayer"];

let regionNames = {};
function buildRegionNames(){
  let dn=null; try{ dn = new Intl.DisplayNames([lang==="zh"?"zh-Hans":lang], {type:"region"}); }catch{}

const $ = (s)=>document.querySelector(s);
let lang = localStorage.getItem("sry_lang") || "en";

function T(){ return I18N[lang]; }
function err(el,key){ el.className=el.classList.contains("smsg")||el.id==="work-msg"?"smsg err":"msg err"; el.textContent = T().errors[key] || T().errors.server; }
function ok(el,text){ el.className=el.id==="work-msg"?"smsg ok":"msg ok"; el.textContent = text; }
function clearMsg(el){ el.className=el.id==="work-msg"?"smsg":"msg"; el.textContent=""; }

async function api(path, opts){
  const res = await fetch("/api/profile/"+path, opts);
  let data=null; try{ data=await res.json(); }catch{}
  if(!data) throw "network";
  if(!data.ok) throw (data.error||"server").split(":")[0].trim();
  return data;
}

function chips(el, list, labels, selected){
  el.innerHTML = "";
  list.forEach(v=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(selected.includes(v)?" on":""); b.textContent=labels[lang][v]||v;
    b.onclick=()=>{ const i=selected.indexOf(v); if(i>=0) selected.splice(i,1); else selected.push(v); chips(el,list,labels,selected); };
    el.appendChild(b);
  });
}

function fillSelect(el, list, labels){
  const cur = el.value;
  el.innerHTML = "";
  list.forEach(v=>{ const o=document.createElement("option"); o.value=v; o.textContent=labels[lang][v]||v; el.appendChild(o); });
  if(list.includes(cur)) el.value=cur;
}

/* ---------- 国家/地区可搜索下拉 ---------- */
function setRegion(code){
  regionCode = code;
  $("#par-region").value = code ? `${flagOf(code)}  ${regionNames[code].local}` : "";
}
function renderRegionList(q){
  const list = $("#region-list");
  const s = (q||"").trim().toLowerCase();
  const hits = CC.filter(c=>{
    if(!s) return true;
    const n = regionNames[c];
    return n.local.toLowerCase().includes(s) || n.en.toLowerCase().includes(s) || c.toLowerCase()===s;
  }).sort((a,b)=>regionNames[a].local.localeCompare(regionNames[b].local, lang==="zh"?"zh-Hans":lang));
  list.innerHTML = "";
  hits.slice(0,200).forEach(c=>{
    const d=document.createElement("div");
    d.className="item"; d.innerHTML=`<span class="flag">${flagOf(c)}</span><span>${regionNames[c].local}</span>`;
    d.onmousedown=(e)=>{ e.preventDefault(); setRegion(c); list.classList.remove("open"); };
    list.appendChild(d);
  });
  list.classList.toggle("open", hits.length>0);
}
$("#par-region").addEventListener("focus",()=>{ $("#par-region").value=""; regionCode=""; renderRegionList(""); });
$("#par-region").addEventListener("input",()=>renderRegionList($("#par-region").value));
$("#par-region").addEventListener("blur",()=>{ setTimeout(()=>{ $("#region-list").classList.remove("open"); if(regionCode) setRegion(regionCode); },120); });

/* ---------- 上传 ---------- */
function bindUpload(fileEl, btnEl, prevEl, kind, onDone, msgEl){
  if(btnEl) btnEl.onclick = ()=>fileEl.click();
  fileEl.onchange = async ()=>{
    const f = fileEl.files[0]; if(!f) return;
    clearMsg(msgEl);
    if(f.size > 5*1024*1024){ err(msgEl,"too_large"); fileEl.value=""; return; }
    if(btnEl){ btnEl.disabled=true; btnEl.textContent=T().uploading; }
    try{
      const fd = new FormData(); fd.append("file", f); fd.append("kind", kind);
      const d = await api("upload",{ method:"POST", body:fd });
      onDone(d.url);
      if(prevEl) prevEl.innerHTML = `<img src="${d.url}" alt="">`;
    }catch(e){ err(msgEl,e); }
    finally{ if(btnEl){ btnEl.disabled=false; btnEl.textContent=T().upload; } fileEl.value=""; }
  };
}

/* ---------- 企业邮箱验证 ---------- */
function renderWorkBadge(){
  const on = !!verifiedEmail;
  $("#work-badge").classList.toggle("on", on);
  if(on) $("#work-badge-mail").textContent = T().verified + " " + verifiedEmail;
}
$("#work-send").onclick = async ()=>{
  const m=$("#work-msg"); clearMsg(m);
  const email = $("#work-email").value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err(m,"invalid_email"); return; }
  $("#work-send").disabled=true;
  try{
    await api("send-work-code",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({email}) });
    $("#work-coderow").style.display="flex"; ok(m, T().codeSent); $("#work-code").focus();
  }catch(e){ err(m,e); }
  finally{ setTimeout(()=>{ $("#work-send").disabled=false; }, 3000); }
};
$("#work-verify").onclick = async ()=>{
  const m=$("#work-msg"); clearMsg(m);
  const email = $("#work-email").value.trim().toLowerCase();
  const code = $("#work-code").value.trim();
  if(!/^\d{6}$/.test(code)){ err(m,"invalid_input"); return; }
  $("#work-verify").disabled=true;
  try{
    const d = await api("verify-work-code",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({email, code}) });
    verifiedEmail = d.verified_email; renderWorkBadge();
    $("#work-coderow").style.display="none"; clearMsg(m);
  }catch(e){ err(m,e); }
  finally{ $("#work-verify").disabled=false; }
};

        <div class="pic">${PRESET_SVG[k]}</div><div class="cap">${label}</div>

/* ---------- 保存 ---------- */
$("#dev-save").onclick = async ()=>{
  const t=T(), m=$("#dev-msg"); clearMsg(m);
  $("#dev-save").disabled=true;
  try{
    await api("save",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        studio_name:$("#dev-studio").value, contact_email:$("#dev-email").value,
        intro:$("#dev-intro").value, logo:devLogoUrl
      })});
    ok(m, t.savedDev);
    if(new URLSearchParams(location.search).get("next")==="submit"){
      setTimeout(()=>{ location.href="/submit-game.html"; }, 600);
    }
  }catch(e){ err(m,e); }
  finally{ $("#dev-save").disabled=false; $("#dev-save").textContent=t.saveDev; }
};

$("#par-save").onclick = async ()=>{
  const t=T(), m=$("#par-msg"); clearMsg(m);
  $("#par-save").disabled=true; $("#par-save").textContent=t.saving;
  try{
    await api("save",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        name_en:$("#par-name-en").value, name_zh:$("#par-name-zh").value, name_ko:$("#par-name-ko").value,
        logo:parLogoUrl, kinds:selKinds, region:regionCode, intro:$("#par-intro").value,
        genres:selGenres, markets:selMarkets,
        steam_url:$("#par-steam").value.trim(), website:$("#par-web").value.trim(),
        contact_email:$("#par-email").value, proof_type:$("#par-prooftype").value, proof_image:parProofUrl
      })});
    status="pending"; renderText(); ok(m, t.saved);
  }catch(e){ err(m,e); }
  finally{ $("#par-save").disabled=false; $("#par-save").textContent=t.save; }
};

$("#par-intro").addEventListener("input",()=>{ $("#par-introcnt").textContent=$("#par-intro").value.length; });
$("#dev-intro").addEventListener("input",()=>{ $("#dev-introcnt").textContent=$("#dev-intro").value.length; });
$("#lang").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; localStorage.setItem("sry_lang",lang); renderText();
});

bindUpload($("#dev-logofile"), null, null, "logo", (u)=>{devLogoUrl=u; renderDevLogoPick();}, $("#dev-msg"));
bindUpload($("#par-file"), $("#par-upbtn"), $("#par-preview"), "proof", (u)=>{parProofUrl=u;}, $("#par-msg"));
bindUpload($("#par-logofile"), $("#par-logobtn"), $("#par-logoprev"), "logo", (u)=>{parLogoUrl=u;}, $("#par-msg"));

(async ()=>{
  renderText();
  try{
    const d = await api("me",{method:"GET"});
    role = d.role; status = d.status;
    const p = d.profile || {};
    if(role==="developer"){
      $("#f-dev").style.display="block";
      $("#dev-studio").value=p.studio_name||""; $("#dev-email").value=p.contact_email||"";
      $("#dev-intro").value=(p.intro||"").slice(0,200); $("#dev-introcnt").textContent=$("#dev-intro").value.length;
      devLogoUrl = p.logo || "preset:solo";
    }else{
      $("#f-par").style.display="block";
      $("#par-name-en").value=p.name_en||""; $("#par-name-zh").value=p.name_zh||""; $("#par-name-ko").value=p.name_ko||"";
      selKinds = Array.isArray(p.kinds)?p.kinds.filter(k=>KINDS.includes(k)):[];
      if(p.region && CC.includes(p.region)) regionCode = p.region;
      $("#par-intro").value=(p.intro||"").slice(0,600); $("#par-introcnt").textContent=$("#par-intro").value.length;
      selGenres = Array.isArray(p.genres)?p.genres.filter(g=>GENRES.includes(g)):[];
      selMarkets = Array.isArray(p.markets)?p.markets.filter(m=>MARKETS.includes(m)):[];
      $("#par-steam").value=p.steam_url||""; $("#par-web").value=p.website||"";
      $("#par-email").value=p.contact_email||"";
      if(p.proof_type) $("#par-prooftype").value=p.proof_type;
      if(p.proof_image){ parProofUrl=p.proof_image; $("#par-preview").innerHTML=`<img src="${p.proof_image}">`; }
      if(p.logo){ parLogoUrl=p.logo; $("#par-logoprev").innerHTML=`<img src="${p.logo}">`; }
      verifiedEmail = p.verified_email || "";
    }
    renderText();
  }catch(e){
    $("#locked").style.display="block";
  }
})();
</script>
