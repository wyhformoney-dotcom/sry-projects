<style>
  :root{
    --bg:#0c0d0a; --panel:#121310; --panel2:#16170f;
    --line:#2c2e26; --line-soft:#1e1f19;
    --ink:#e7e7df; --ink-dim:#9a9b92; --ink-faint:#6b6d62;
    --accent:#c6f24e; --accent-ink:#0c0d0a;
    --mono:'Space Mono',monospace; --sans:'Archivo',sans-serif; --cjk:'Noto Sans SC',sans-serif; --kr:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:46px 46px; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  body[lang="zh"] .cjk-swap{ font-family:var(--cjk); }
  body[lang="ko"] .cjk-swap{ font-family:var(--kr); }

  .nav{ display:flex; align-items:center; gap:22px; padding:16px 28px; border-bottom:1px solid var(--line-soft); }
  .brand{ display:flex; flex-direction:column; justify-content:center; gap:2px; }
  .logo{ display:flex; align-items:center; gap:9px; font-family:var(--sans); font-weight:900; font-size:17px; letter-spacing:-.01em; }
  .logo .mark{ width:11px; height:11px; background:var(--accent); display:inline-block; }
  .logo b{ color:var(--ink-dim); font-weight:700; } .logo .hub{ color:#fff; }
  .poweredby{ font-family:var(--mono); font-size:9.5px; letter-spacing:.03em; color:var(--ink-faint); transition:color .15s; padding-left:20px; }
  .poweredby:hover{ color:var(--accent); }
  .nav-links{ display:flex; align-items:center; gap:4px; }
  .nav-links a{ font-family:var(--mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-dim); padding:8px 12px; border-radius:6px; position:relative; transition:color .15s; }
  .nav-links a:hover{ color:#fff; }
  .nav-links a.active{ color:#fff; }
  .nav-links a.active::after{ content:""; position:absolute; left:12px; right:12px; bottom:2px; height:2px; background:var(--accent); }
  .nav-links a.soon{ color:var(--ink-faint); cursor:default; }
  .nav-links a.soon .soon-tag{ font-size:8px; vertical-align:super; color:var(--accent); margin-left:3px; letter-spacing:.1em; }
  @media (max-width:640px){ .nav-links{ display:none; } }
  .nav-spacer{ flex:1; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .lang button{ font-family:var(--mono); font-size:11px; padding:6px 11px; background:transparent; color:var(--ink-dim); border:none; cursor:pointer; }
  .lang button.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }
  .acct{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; padding:7px 12px; border:1px solid var(--line); border-radius:7px; color:var(--ink-dim); white-space:nowrap; }
  .acct:hover{ color:var(--accent); border-color:var(--accent); }

  .wrap{ max-width:680px; margin:0 auto; padding:40px 20px 90px; }
  .backlink{ display:inline-block; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); margin-bottom:22px; }
  .backlink:hover{ color:var(--accent); }

  .pcard{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:28px; }
  .phead{ display:flex; gap:18px; align-items:center; margin-bottom:18px; }
  .plogo{ width:76px; height:76px; border-radius:14px; background:var(--panel2); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; overflow:hidden; flex:none; color:var(--ink-faint); font-size:26px; }
  .plogo img{ width:100%; height:100%; object-fit:cover; }
  .pname{ font-weight:900; font-size:23px; letter-spacing:-.01em; }
  .pregion{ font-family:var(--mono); font-size:11.5px; color:var(--ink-faint); margin-top:6px; }
  .pkinds{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
  .kpill{ font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:5px 12px;
    border-radius:13px; background:var(--accent); color:var(--accent-ink); }
  .kpill.inv{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .pintro{ font-size:14px; line-height:1.75; color:var(--ink-dim); margin-bottom:20px; white-space:pre-wrap; }
  .plinks{ display:flex; gap:16px; margin-bottom:24px; }
  .plinks a{ font-family:var(--mono); font-size:11.5px; letter-spacing:.05em; color:var(--ink-dim); }
  .plinks a:hover{ color:var(--accent); }

  .contactbar{ border-top:1px solid var(--line-soft); padding-top:22px; }
  .getbtn{ width:100%; padding:14px 0; border:none; border-radius:9px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.08em; }
  .getbtn:disabled{ opacity:.5; cursor:default; }
  .gatemsg{ font-size:12.5px; color:var(--ink-dim); line-height:1.7; margin-top:12px; display:none; }
  .gatemsg a{ color:var(--accent); }

  .cmodal-mask{ position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .cmodal{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; max-width:420px; width:100%; }
  .cmodal .ct{ font-weight:900; font-size:17px; margin-bottom:6px; }
  .cmodal .cn{ font-size:13px; color:var(--ink-dim); margin-bottom:16px; }
  .cmodal .cbox{ background:var(--panel2); border:1px solid var(--line); border-radius:9px; padding:14px; font-family:var(--mono); font-size:14px; word-break:break-all; display:flex; align-items:center; gap:10px; }
  .cmodal .cbox a{ color:var(--accent); flex:1; }
  .cmodal .copybtn{ background:transparent; border:1px solid var(--line); border-radius:6px; color:var(--ink-dim); font-family:var(--mono); font-size:10.5px; padding:6px 10px; cursor:pointer; }
  .cmodal .copybtn:hover{ border-color:var(--accent); color:var(--accent); }
  .cmodal .cq{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); margin-top:14px; }
  .cmodal .cclose{ margin-top:16px; width:100%; padding:11px 0; background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; font-family:var(--mono); font-weight:700; font-size:12px; letter-spacing:.08em; cursor:pointer; }

  .state{ text-align:center; padding:80px 10px; color:var(--ink-faint); font-size:14px; display:none; }
</style>

<script>
const PRESET_SVG={solo:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#16170f"/><circle cx="24" cy="19" r="7" fill="none" stroke="#c6f24e" stroke-width="2.4"/><path d="M12 38c0-7 5.4-11 12-11s12 4 12 11" fill="none" stroke="#c6f24e" stroke-width="2.4" stroke-linecap="round"/></svg>',team:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#16170f"/><circle cx="18" cy="18" r="5" fill="none" stroke="#c6f24e" stroke-width="2.2"/><circle cx="32" cy="20" r="4" fill="none" stroke="#c6f24e" stroke-width="2"/><path d="M9 37c0-6 4-9.5 9-9.5s9 3.5 9 9.5" fill="none" stroke="#c6f24e" stroke-width="2.2" stroke-linecap="round"/><path d="M29 31.5c1-.9 2.4-1.5 4-1.5 4 0 6.5 2.8 6.5 7" fill="none" stroke="#c6f24e" stroke-width="2" stroke-linecap="round"/></svg>',studio:'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#16170f"/><rect x="13" y="14" width="22" height="21" rx="2" fill="none" stroke="#c6f24e" stroke-width="2.2"/><path d="M19 35v-6h4v6M25 35v-6h4v6M18 20h3M27 20h3M18 24.5h3M27 24.5h3" stroke="#c6f24e" stroke-width="2" stroke-linecap="round"/></svg>'};
function logoSrc(v){ return (typeof v==="string"&&v.startsWith("preset:")) ? "data:image/svg+xml,"+encodeURIComponent(PRESET_SVG[v.slice(7)]||PRESET_SVG.solo) : v; }
const KIND_L = { en:{publishing:"PUBLISHING",investment:"INVESTMENT"}, zh:{publishing:"发行",investment:"投资"}, ko:{publishing:"퍼블리싱",investment:"투자"} };
const flagOf = (cc)=>/^[A-Z]{2}$/.test(cc||"") ? String.fromCodePoint(...[...cc].map(c=>0x1F1A5+c.charCodeAt(0))) : "";

const I18N = {
  en:{ nlProjects:"Projects", nlPartners:"Partners", nlEvents:"Events", poweredBy:"powered by SRY Interactive ↗", back:"← All Partners", notfound:"Partner not found or not yet verified.", signin:"Sign In",

    cmClose:"CLOSE", cmCopied:"COPIED ✓", cmSelf:"This is your own public contact — other partners can't see it.", cmPrivate:"This partner keeps their email private. We've recorded your interest and will pass it on in our monthly summary — this doesn't use your quota. For anything urgent, email us.", cmFallback:"This partner hasn't provided contact details. To reach them, email us at wangyanhui@sryinteractive.com — this doesn't use your quota.",
    gClose:"CLOSE",
    gGuest:{ t:"Developers Only", m:"Partner contacts are visible to developers with at least one approved game. Sign in — or register — as a developer to unlock them.", cta:"SIGN IN AS DEVELOPER →" },
    gPartner:{ t:"This is a Developer Feature", m:"Contacting partners is for developers. Partner accounts can't view other partners' contacts. To use this, register a developer account with a different email.", cta:"REGISTER AS DEVELOPER →" },
    gNeedGame:{ t:"Approved Game Required", m:"Unlocking partner contacts requires at least one approved game on your account. Submit your game — once it passes review, come back and reach out.", cta:"SUBMIT YOUR GAME →" },

    partnerSide:'Partner accounts can\'t view other partners\' contacts. To use this as a developer, register a developer account with a different email. <a href="/login.html?pick=1">Register →</a>', guestMsg:'Unlocking contacts requires a developer account with at least one approved game. <a href="/login.html?pick=1&next=NEXT">Sign in / register as developer →</a>' },
  zh:{ nlProjects:"项目", nlPartners:"合作发行商", nlEvents:"行业活动", poweredBy:"由 SRY Interactive 出品 ↗", back:"← 全部合作方", notfound:"未找到该合作方,或尚未通过认证。", signin:"登录",
    get:"获取联系方式", cmTitle:"合作方联系方式", cmAlready:"(此前已解锁,不占额度)",
    cmQuota:(u,q)=>`本月已解锁 ${u}/${q} 个联系人,每月 1 日重置。`,
    cmOver:(u,q)=>`本月额度已用完(${u}/${q}),下月 1 日重置。`,
    cmClose:"关闭", cmCopied:"已复制 ✓", cmSelf:"这是你自己的对外联系方式,其他合作方看不到。", cmPrivate:"该合作方选择不公开邮箱。我们已记录你的对接意向,会在每月汇总时转达——此操作不占用你的查看次数。如有急事可直接邮件我们。", cmFallback:"该合作方未留下联系方式。如需联系,请邮件 wangyanhui@sryinteractive.com,此操作不占用你的查看次数。",
    gClose:"关闭",
    gGuest:{ t:"开发者专属", m:"合作方的联系方式仅对拥有已过审游戏的开发者开放。请以开发者身份登录或注册后解锁。", cta:"以开发者身份登录 →" },
    gPartner:{ t:"这是开发者功能", m:"联系合作方是开发者的功能,合作方账号之间不能互相查看联系方式。如需使用,请用另一个邮箱注册开发者账号。", cta:"注册开发者账号 →" },
    gNeedGame:{ t:"需要一款已过审的游戏", m:"解锁合作方联系方式,需要你名下至少有一款通过审核的游戏。先去提交游戏,过审后再来主动出击。", cta:"去提交游戏 →" },
    needGame:'解锁联系方式需要你至少有一款已通过审核的游戏。<a href="/submit-game.html">去提交游戏 →</a>',
    partnerSide:'合作方之间不能互相查看联系方式。如需以开发者身份使用,请用另一个邮箱注册开发者账号。<a href="/login.html?pick=1">去注册 →</a>', guestMsg:'解锁联系方式需要开发者账号(且至少有一款已过审的游戏)。<a href="/login.html?pick=1&next=NEXT">以开发者身份登录 / 注册 →</a>' },
  ko:{ nlProjects:"프로젝트", nlPartners:"파트너", nlEvents:"행사", poweredBy:"SRY Interactive 제공 ↗", back:"← 모든 파트너", notfound:"파트너를 찾을 수 없거나 아직 인증되지 않았습니다.", signin:"로그인",
    get:"연락처 보기", cmTitle:"파트너 연락처", cmAlready:"(이미 해제됨 — 무료)",
    cmQuota:(u,q)=>`이번 달 ${u}/${q}개 해제. 매월 1일 초기화.`,
    cmOver:(u,q)=>`이번 달 한도를 모두 사용했습니다(${u}/${q}). 다음 달 1일 초기화.`,
    cmClose:"닫기", cmCopied:"복사됨 ✓", cmSelf:"이것은 회원님의 공개 연락처입니다. 다른 파트너에게는 보이지 않습니다.", cmPrivate:"이 파트너는 이메일을 공개하지 않습니다. 관심을 기록해 월간 요약에 전달합니다. 조회 횟수가 차감되지 않습니다.", cmFallback:"이 파트너는 연락처를 제공하지 않았습니다. wangyanhui@sryinteractive.com 으로 메일 주세요. 조회 횟수가 차감되지 않습니다.",
    gClose:"닫기",
    gGuest:{ t:"개발자 전용", m:"파트너 연락처는 승인된 게임이 있는 개발자에게만 공개됩니다. 개발자로 로그인 또는 가입 후 해제하세요.", cta:"개발자로 로그인 →" },
    gPartner:{ t:"개발자 전용 기능입니다", m:"파트너 연락은 개발자 기능입니다. 파트너 계정끼리는 연락처를 볼 수 없습니다. 다른 이메일로 개발자 계정을 등록하세요.", cta:"개발자 계정 등록 →" },
    gNeedGame:{ t:"승인된 게임 필요", m:"파트너 연락처 해제는 승인된 게임이 1개 이상 필요합니다. 게임을 제출하고 승인 후 다시 오세요.", cta:"게임 제출 →" },
    needGame:'연락처 해제는 승인된 게임이 1개 이상 있는 개발자만 가능합니다. <a href="/submit-game.html">게임 제출 →</a>',
    partnerSide:'파트너 계정끼리는 연락처를 볼 수 없습니다. 개발자로 이용하려면 다른 이메일로 개발자 계정을 등록하세요. <a href="/login.html?pick=1">등록 →</a>', guestMsg:'연락처 해제는 승인된 게임이 1개 이상 있는 개발자 계정만 가능합니다. <a href="/login.html?pick=1&next=NEXT">개발자로 로그인 / 등록 →</a>' }
};

const $ = (s)=>document.querySelector(s);
const esc = (s)=>String(s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let lang = localStorage.getItem("sry_lang") || "en";
let P=null, ME=null;
const PID = parseInt(new URLSearchParams(location.search).get("id"),10) || 0;
function T(){ return I18N[lang]; }
let regionName=(c)=>c;
function buildRegionNames(){
  try{ const dn=new Intl.DisplayNames([lang==="zh"?"zh-Hans":lang],{type:"region"});
    regionName=(cc)=>{ try{ return (cc&&dn.of(cc))||cc; }catch{ return cc; } };
  }catch{ regionName=(c)=>c; }
}
function nameOf(r){
  if(lang==="zh") return r.name_zh||r.name_en||r.name_ko;
  if(lang==="ko") return r.name_ko||r.name_en||r.name_zh;
  return r.name_en||r.name_zh||r.name_ko;
}

function render(){
  document.body.setAttribute("lang",lang);
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  buildRegionNames();
  const t=T();
  $("#poweredby").textContent=t.poweredBy;
  $("#nl-projects").textContent=t.nlProjects;
  $("#nl-partners").textContent=t.nlPartners;
  $("#nl-events").childNodes[0].nodeValue=t.nlEvents;
  $("#backlink").textContent=t.back;
  $("#notfound").textContent=t.notfound;
  const a=$("#acct"); if(!a.dataset.logged) a.textContent=t.signin;
  if(!P) return;
  $("#plogo").innerHTML = P.logo?`<img src="${esc(logoSrc(P.logo))}">`:"▢";
  $("#pname").textContent = nameOf(P);
  $("#pregion").textContent = `${flagOf(P.region)} ${regionName(P.region)}`;
  $("#pkinds").innerHTML = (P.kinds||[]).map(k=>`<span class="kpill${k==="investment"?" inv":""}">${KIND_L[lang][k]||k}</span>`).join("");
  const intro = lang==="zh"?P.intro_zh:lang==="ko"?P.intro_ko:P.intro_en;
  $("#pintro").textContent = intro||"";
  $("#pintro").style.display = intro?"block":"none";
  $("#plinks").innerHTML = [
    P.website?`<a href="${esc(P.website)}" target="_blank" rel="noopener">WEBSITE ↗</a>`:"",
    P.steam_url?`<a href="${esc(P.steam_url)}" target="_blank" rel="noopener">STEAM ↗</a>`:"",
  ].filter(Boolean).join("");
  $("#getbtn").textContent=t.get;
  $("#getbtn").style.display = "block";
  $("#gatemsg").style.display = "none";
}

function gateShow(kind){
  const t=T();
  const M = kind==="guest" ? t.gGuest : kind==="partner" ? t.gPartner : t.gNeedGame;
  const next = encodeURIComponent("/partner.html?id="+PID);
  const hrefs = { guest:"/login.html?pick=1&next="+next, partner:"/login.html?pick=1", needGame:"/submit-game.html" };
  $("#gm-title").textContent=M.t;
  $("#gm-msg").textContent=M.m;
  const cta=$("#gm-cta"); cta.textContent=M.cta; cta.href=hrefs[kind];
  $("#gm-close").textContent=t.gClose;
  $("#gmask").style.display="flex";
}
$("#gm-close").onclick=()=>{ $("#gmask").style.display="none"; };
$("#gmask").addEventListener("click",(e)=>{ if(e.target.id==="gmask") e.target.style.display="none"; });

function cmShow({name, contact, already, used, quota, overLimit, self, fallback, privateContact}){
  const t=T();
  $("#cm-title").textContent=t.cmTitle;
  $("#cm-name").textContent=name||"";
  const box=document.querySelector("#cmask .cbox");
  if(overLimit){ box.style.display="none"; $("#cm-quota").textContent=t.cmOver(used,quota); }
  else{
    box.style.display="flex";
    const a=$("#cm-contact"); a.textContent=contact;
    a.href=/^https?:/i.test(contact)?contact:"mailto:"+contact;
    $("#cm-quota").textContent = privateContact ? t.cmPrivate : fallback ? t.cmFallback : self ? t.cmSelf : (t.cmQuota(used,quota)+(already?" "+t.cmAlready:""));
  }
  $("#cm-close").textContent=t.cmClose;
  $("#cmask").style.display="flex";
}
$("#cm-close").onclick=()=>{ $("#cmask").style.display="none"; };
$("#cmask").addEventListener("click",(e)=>{ if(e.target.id==="cmask") e.target.style.display="none"; });
$("#cm-copy").onclick=async ()=>{
  try{ await navigator.clipboard.writeText($("#cm-contact").textContent);
    $("#cm-copy").textContent=T().cmCopied; setTimeout(()=>{ $("#cm-copy").textContent="COPY"; },1500); }catch(e){}
};

$("#getbtn").onclick = async ()=>{
  if(!(ME && ME.loggedIn && !ME.needsRole)){ gateShow("guest"); return; }
  $("#getbtn").disabled=true;
  try{
    const res=await fetch("/api/contacts/reveal",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({ type:"partner", target_id:PID }) });
    const rd=await res.json();
    if(rd.ok) cmShow(rd);
    else if(rd.error==="quota_exceeded") cmShow({ overLimit:true, used:rd.used, quota:rd.quota });
    else if(rd.error==="no_approved_game") gateShow("needGame");
    else if(rd.error==="developer_only") gateShow("partner");
    else if(rd.error==="not_logged_in") gateShow("guest");
  }catch(e){}
  finally{ $("#getbtn").disabled=false; }
};

$("#lang").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; localStorage.setItem("sry_lang",lang); render();
});

(async ()=>{
  render();
  $("#loading").style.display="block";
  try{
    const r=await fetch("/api/auth/me"); ME=await r.json();
    if(ME && ME.loggedIn && !ME.needsRole){
      const a=$("#acct"); a.dataset.logged="1";
      a.textContent="▸ "+(ME.email||"").split("@")[0].slice(0,14);
      a.href="/account.html";
    }
  }catch(e){}
  try{
    const r=await fetch("/api/partners"); const d=await r.json();
    if(Array.isArray(d)) P = d.find(x=>x.id===PID) || null;
  }catch(e){}
  $("#loading").style.display="none";
  if(!P){ $("#notfound").style.display="block"; render(); return; }
  $("#pcard").style.display="block";
  render();
})();
</script>
