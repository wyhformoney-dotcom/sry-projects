<!-- SRY Game Hub — 游戏提交表单(开发者) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit Your Game · SRY Game Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0c0d0a; --panel:#121310; --panel2:#16170f;
    --line:#2c2e26; --line-soft:#1e1f19;
    --ink:#e7e7df; --ink-dim:#9a9b92; --ink-faint:#6b6d62;
    --accent:#c6f24e; --accent-ink:#0c0d0a; --danger:#f26d5b;
    --mono:'Space Mono',monospace; --sans:'Archivo',sans-serif; --cjk:'Noto Sans SC',sans-serif; --kr:'Noto Sans KR',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  a{text-decoration:none;color:inherit;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
    background-size:46px 46px; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  body[lang="zh"] .cjk-swap{ font-family:var(--cjk); }
  body[lang="ko"] .cjk-swap{ font-family:var(--kr); }

  .nav{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line-soft); }
  .logo{ display:flex; align-items:center; gap:9px; font-weight:900; font-size:17px; }
  .logo .mark{ width:11px; height:11px; background:var(--accent); display:inline-block; }
  .lang{ display:flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .lang button{ font-family:var(--mono); font-size:11px; padding:6px 11px; background:transparent; color:var(--ink-dim); border:none; cursor:pointer; }
  .lang button.on{ background:var(--accent); color:var(--accent-ink); font-weight:700; }

  .wrap{ max-width:600px; margin:0 auto; padding:48px 20px 90px; }
  .kicker{ font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--accent); margin-bottom:10px; }
  h1{ font-size:28px; font-weight:900; letter-spacing:-.02em; margin-bottom:8px; }
  .lead{ color:var(--ink-dim); font-size:13.5px; line-height:1.6; margin-bottom:24px; }

  .card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 24px 26px; }
  .sec{ display:flex; align-items:center; gap:12px; margin:30px 0 20px; }
  .sec .num{ font-family:var(--mono); font-size:11px; font-weight:700; color:var(--accent-ink); background:var(--accent); padding:3px 8px; border-radius:4px; }
  .sec .st{ font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
  .sec .rule{ flex:1; height:1px; background:var(--line-soft); }

  /* 题号:每个字段自动编号,漏填一眼可见 */
  .card{ counter-reset:q; }
  .f{ margin-bottom:28px; }
  .f > label{ display:flex; align-items:baseline; gap:9px; font-size:14px; font-weight:800; margin:0 0 5px; }
  .f > label::before{ counter-increment:q; content:counter(q,decimal-leading-zero);
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--accent);
    border:1px solid var(--accent); border-radius:4px; padding:2px 6px; flex:none; }
  label{ display:block; font-size:13px; font-weight:700; margin:0 0 4px; }
  label .req{ color:var(--accent); }
  label .multi{ font-family:var(--mono); font-size:10px; font-weight:400; color:var(--ink-faint); margin-left:6px; }
  .sub{ font-size:11.5px; color:var(--ink-faint); line-height:1.55; margin:0 0 9px; }
  input[type=text], input[type=url], textarea{
    width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    color:var(--ink); font-size:14px; padding:11px 13px; outline:none; font-family:inherit;
  }
  input::placeholder, textarea::placeholder{ color:var(--ink-faint); }
  input:focus, textarea:focus{ border-color:var(--accent); }
  textarea{ min-height:110px; resize:vertical; line-height:1.6; }
  .cnt{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); text-align:right; margin-top:4px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{ font-family:var(--mono); font-size:11.5px; padding:7px 12px; border:1px solid var(--line); border-radius:20px;
    background:transparent; color:var(--ink-dim); cursor:pointer; transition:all .12s; }
  .chip.on{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700; }

  /* 封面(横图) */
  .coverup{ border:1px dashed var(--line); border-radius:10px; background:var(--panel2); aspect-ratio:16/9;
    display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; color:var(--ink-faint); }
  .coverup:hover{ border-color:var(--accent); }
  .coverup img{ width:100%; height:100%; object-fit:cover; }
  /* 截图九宫 */
  .shots{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .shot{ position:relative; aspect-ratio:16/9; border:1px dashed var(--line); border-radius:8px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center; overflow:hidden; color:var(--ink-faint); font-size:20px; cursor:pointer; }
  .shot:hover{ border-color:var(--accent); }
  .shot img{ width:100%; height:100%; object-fit:cover; }
  .shot .rm{ position:absolute; top:4px; right:4px; width:20px; height:20px; border-radius:5px; background:rgba(0,0,0,.7);
    color:var(--danger); border:none; cursor:pointer; font-size:12px; line-height:1; display:none; }
  .shot.has .rm{ display:block; }

  .btn{ width:100%; margin-top:8px; padding:14px 0; border:none; border-radius:8px; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); font-family:var(--mono); font-weight:700; font-size:13px;
    letter-spacing:.08em; text-transform:uppercase; }
  .btn:disabled{ opacity:.45; cursor:default; }
  .msg{ font-size:12.5px; margin-top:12px; display:none; }
  .msg.err{ display:block; color:var(--danger); }
  .msg.ok{ display:block; color:var(--accent); }
  .back{ display:inline-block; margin-top:22px; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); }
  .back:hover{ color:var(--accent); }
  .locked{ text-align:center; padding:60px 10px; display:none; }
  .locked p{ color:var(--ink-dim); font-size:13.5px; line-height:1.8; }
  .locked a{ color:var(--accent); }
  #form{ display:none; }
</style>

<nav class="nav">
  <a class="logo" href="/"><span class="mark"></span>SRY GAME HUB</a>
  <div class="lang" id="lang">
    <button data-l="en" class="on">EN</button><button data-l="zh">中文</button><button data-l="ko">한국어</button>
  </div>
</nav>

<div class="wrap">
  <div class="kicker" id="kicker">DEVELOPER // SUBMIT GAME</div>
  <h1 id="title"></h1>
  <p class="lead cjk-swap" id="lead"></p>
  <a href="/login.html?pick=1" id="switchrole" style="display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:7px;padding:7px 12px;margin-bottom:20px"></a>

  <div class="locked" id="locked"><p class="cjk-swap" id="locked-text"></p></div>

  <!-- 邮箱验证:未登录开发者上来先过这一步,验证即自动建号 -->
  <div class="card" id="gate" style="display:none;padding:24px">
    <div class="f" style="margin-bottom:0">
      <label><span id="ge1"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="ge1n"></p>
      <input type="email" id="gate-email" autocomplete="email" placeholder="you@studio.com">
      <div id="gate-coderow" style="display:none;margin-top:12px">
        <label><span id="ge2"></span> <span class="req">*</span></label>
        <input type="text" id="gate-code" inputmode="numeric" maxlength="6" style="letter-spacing:8px;text-align:center;font-family:var(--mono);font-size:20px">
      </div>
      <button class="btn" id="gate-btn"></button>
      <button class="btn" id="gate-resend" style="display:none;background:transparent;color:var(--ink-dim);border:1px solid var(--line);margin-top:10px"></button>
      <div class="msg" id="gate-msg"></div>
      <p class="sub cjk-swap" id="gate-hint" style="margin-top:14px"></p>
    </div>
  </div>

  <div class="card" id="form">
    <div class="sec"><span class="num">01</span><span class="st" id="s1"></span><span class="rule"></span></div>
    <div class="f"><label><span id="g1"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g1n"></p>
      <div id="tp"><input type="text" id="t-en" maxlength="120"></div>
      <div class="row2" style="margin-top:8px" id="to">
        <input type="text" id="t-zh" maxlength="120">
        <input type="text" id="t-ko" maxlength="120">
      </div></div>
    <div class="f"><label><span id="g2"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g2n"></p>
      <input type="text" id="d-en" maxlength="160">
      <div class="cnt"><span id="d-cnt">0</span>/160</div></div>
    <div class="f"><label><span id="g3"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g3n"></p>
      <textarea id="full-en" maxlength="2000"></textarea>
      <div class="cnt"><span id="full-cnt">0</span>/2000</div></div>

    <div class="sec"><span class="num">02</span><span class="st" id="s2"></span><span class="rule"></span></div>
    <div class="f"><label><span id="g4"></span> <span class="req">*</span></label>
      <div class="chips" id="stage"></div></div>
    <div class="f"><label><span id="g5"></span> <span class="req">*</span><span class="multi" id="g5m"></span></label>
      <div class="chips" id="genres"></div></div>
    <div class="f"><label><span id="g6"></span> <span class="req">*</span><span class="multi" id="g6m"></span></label>
      <div class="chips" id="platforms"></div></div>
    <div class="f"><label><span id="g7"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g7n"></p>
      <div class="chips" id="market"></div></div>
    <div class="f"><label><span id="g8"></span> <span class="req">*</span><span class="multi" id="g8m"></span></label>
      <div class="chips" id="needs"></div></div>

    <div class="sec"><span class="num">03</span><span class="st" id="s3"></span><span class="rule"></span></div>
    <div class="f"><label id="g9"></label>
      <input type="url" id="steam" placeholder="https://store.steampowered.com/app/..."></div>
    <div class="f"><label id="g10"></label>
      <p class="sub cjk-swap" id="g10n"></p>
      <input type="url" id="video" placeholder="https://youtube.com/watch?v=..."></div>

    <div class="sec"><span class="num">04</span><span class="st" id="s4"></span><span class="rule"></span></div>
    <div class="f"><label><span id="g11"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g11n"></p>
      <div class="coverup" id="coverbox">+</div>
      <input type="file" id="coverfile" accept="image/jpeg,image/png,image/webp" hidden></div>
    <div class="f"><label><span id="g12"></span> <span class="req">*</span></label>
      <p class="sub cjk-swap" id="g12n"></p>
      <div class="shots" id="shots"></div>
      <input type="file" id="shotfile" accept="image/jpeg,image/png,image/webp" hidden></div>

    <button class="btn" id="submit"></button>
    <div class="msg" id="msg"></div>
  </div>

  <a class="back" href="/account.html" id="back"></a>
</div>

const $ = (s)=>document.querySelector(s);
let lang = localStorage.getItem("sry_lang") || "en";
let selStage=[], selGenres=[], selPlatforms=[], selMarket=[], selNeeds=[];
let coverUrl="", shotUrls=[];
let gateCodeSent=false, gateVerified=false, gateCooldown=0, gateTimer=null;

function T(){ return I18N[lang]; }
function err(key){ const m=$("#msg"); m.className="msg err"; m.textContent=T().errors[key]||T().errors.server; }
function okmsg(){ const m=$("#msg"); m.className="msg ok"; m.textContent=T().ok; }
function clearMsg(){ const m=$("#msg"); m.className="msg"; m.textContent=""; }

async function api(path, opts){
  const res = await fetch(path, opts);
  let data=null; try{ data=await res.json(); }catch{}
  if(!data) throw "network";
  if(!data.ok) throw (data.error||"server").split(":")[0].trim();
  return data;
}

function chips(el, list, labels, selected, single){
  el.innerHTML="";
  list.forEach(v=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip"+(selected.includes(v)?" on":""); b.textContent=labels[lang][v]||v;
    b.onclick=()=>{ const i=selected.indexOf(v);
      if(i>=0) selected.splice(i,1); else { if(single) selected.length=0; selected.push(v); }
      chips(el,list,labels,selected,single); };
    el.appendChild(b);
  });
}

/* 封面上传 */
$("#coverbox").onclick = ()=>$("#coverfile").click();
$("#coverfile").onchange = async ()=>{
  const f=$("#coverfile").files[0]; if(!f) return; clearMsg();
  if(f.size>5*1024*1024){ err("too_large"); $("#coverfile").value=""; return; }
  try{
    const fd=new FormData(); fd.append("file",f); fd.append("kind","cover");
    const d=await api("/api/games-submit/upload",{method:"POST",body:fd});
    coverUrl=d.url; $("#coverbox").innerHTML=`<img src="${d.url}">`;
  }catch(e){ err(e); }
  finally{ $("#coverfile").value=""; }
};

/* 截图九宫 */
function renderShots(){
  const el=$("#shots"); el.innerHTML="";
  shotUrls.forEach((u,i)=>{
    const d=document.createElement("div"); d.className="shot has";
    d.innerHTML=`<img src="${u}"><button class="rm" type="button">✕</button>`;
    d.querySelector(".rm").onclick=(e)=>{ e.stopPropagation(); shotUrls.splice(i,1); renderShots(); };
    el.appendChild(d);
  });
  if(shotUrls.length<MAX_SHOTS){
    const d=document.createElement("div"); d.className="shot"; d.textContent="+";
    d.onclick=()=>$("#shotfile").click();
    el.appendChild(d);
  }
}
$("#shotfile").onchange = async ()=>{
  const f=$("#shotfile").files[0]; if(!f) return; clearMsg();
  if(f.size>5*1024*1024){ err("too_large"); $("#shotfile").value=""; return; }
  try{
    const fd=new FormData(); fd.append("file",f); fd.append("kind","shot");
    const d=await api("/api/games-submit/upload",{method:"POST",body:fd});
    shotUrls.push(d.url); renderShots();
  }catch(e){ err(e); }
  finally{ $("#shotfile").value=""; }
};

function renderText(){
  document.body.setAttribute("lang",lang);
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  const t=T();
  $("#kicker").textContent=t.kicker; $("#title").textContent=t.title; $("#lead").textContent=t.lead; $("#back").textContent=t.back;
  $("#s1").textContent=t.s1; $("#s2").textContent=t.s2; $("#s3").textContent=t.s3; $("#s4").textContent=t.s4;
  $("#switchrole").textContent=t.switchRole; $("#ge1").textContent=t.ge1; $("#ge1n").textContent=t.ge1n; $("#ge2").textContent=t.ge2;
  $("#gate-hint").textContent=t.gateHint;
  if(!gateVerified) $("#gate-btn").textContent = gateCodeSent ? t.gateVerify : t.gateSend;
  $("#gate-resend").textContent=t.gateResend;
  $("#g1").textContent=t.g1; $("#g1n").textContent=t.g1n;
  $("#t-en").placeholder=t.ph_t_en; $("#t-zh").placeholder=t.ph_t_zh; $("#t-ko").placeholder=t.ph_t_ko;
  const ord = lang==="zh" ? ["zh","en","ko"] : lang==="ko" ? ["ko","en","zh"] : ["en","zh","ko"];
  $("#tp").appendChild(document.getElementById("t-"+ord[0]));
  $("#to").appendChild(document.getElementById("t-"+ord[1]));
  $("#to").appendChild(document.getElementById("t-"+ord[2]));
  $("#g2").textContent=t.g2; $("#g2n").textContent=t.g2n; $("#d-en").placeholder=t.ph_d;
  $("#g3").textContent=t.g3; $("#g3n").textContent=t.g3n; $("#full-en").placeholder=t.ph_full;
  $("#g4").textContent=t.g4; $("#g5").textContent=t.g5; $("#g5m").textContent=t.multi;
  $("#g6").textContent=t.g6; $("#g6m").textContent=t.multi;
  $("#g7").textContent=t.g7; $("#g7n").textContent=t.g7n;
  $("#g8").textContent=t.g8; $("#g8m").textContent=t.multi;
  $("#g9").textContent=t.g9; $("#g10").textContent=t.g10; $("#g10n").textContent=t.g10n;
  $("#g11").textContent=t.g11; $("#g11n").textContent=t.g11n;
  $("#g12").textContent=t.g12; $("#g12n").textContent=t.g12n;
  $("#submit").textContent=t.submit;
  chips($("#stage"), STAGES, STAGE_L, selStage, true);
  chips($("#genres"), GENRES, GENRE_L, selGenres);
  chips($("#platforms"), PLATFORMS, PLATFORM_L, selPlatforms);
  chips($("#market"), MARKETS, MARKET_L, selMarket, true);
  chips($("#needs"), NEEDS, NEED_L, selNeeds);
  renderShots();
}

const isUrl=(v)=>v===""||/^https?:\/\/\S+$/i.test(v);

$("#submit").onclick = async ()=>{
  const t=T(); clearMsg();
  const primary = lang==="zh" ? "#t-zh" : lang==="ko" ? "#t-ko" : "#t-en";
  if(!$(primary).value.trim()) return err("title_required");
  if(!$("#d-en").value.trim()) return err("pitch_required");
  if(!$("#full-en").value.trim()) return err("desc_required");
  if(!selStage.length) return err("stage_required");
  if(!selGenres.length) return err("genres_required");
  if(!selPlatforms.length) return err("platforms_required");
  if(!selMarket.length) return err("market_required");
  if(!selNeeds.length) return err("needs_required");
  if(!isUrl($("#steam").value.trim())||!isUrl($("#video").value.trim())) return err("url_invalid");
  if(!coverUrl) return err("cover_required");
  if(!shotUrls.length) return err("shots_required");
  $("#submit").disabled=true; $("#submit").textContent=t.submitting;
  try{
    await api("/api/games-submit/create",{ method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        t_en:$("#t-en").value, t_zh:$("#t-zh").value, t_ko:$("#t-ko").value,
        d_en:$("#d-en").value, full_en:$("#full-en").value,
        stage:selStage[0], genres:selGenres, platforms:selPlatforms,
        region:selMarket[0], needs:selNeeds,
        steam_url:$("#steam").value.trim(), video:$("#video").value.trim(),
        cover:coverUrl, screenshots:shotUrls
      })});
    okmsg();
    window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
  }catch(e){ err(e); }
  finally{ $("#submit").disabled=false; $("#submit").textContent=t.submit; }
};

$("#d-en").addEventListener("input",()=>{ $("#d-cnt").textContent=$("#d-en").value.length; });
$("#full-en").addEventListener("input",()=>{ $("#full-cnt").textContent=$("#full-en").value.length; });
$("#lang").addEventListener("click",(e)=>{
  const b=e.target.closest("button"); if(!b) return;
  lang=b.dataset.l; localStorage.setItem("sry_lang",lang); renderText();
});

function showForm(){
  gateVerified=true;
  $("#gate").style.display="none";
  $("#form").style.display="block";
}

async function gateStartCooldown(){
  gateCooldown=60; $("#gate-resend").style.display="block"; $("#gate-resend").disabled=true;
  clearInterval(gateTimer);
  gateTimer=setInterval(()=>{ gateCooldown--;
    $("#gate-resend").textContent = gateCooldown>0 ? `${T().gateResend} (${gateCooldown})` : T().gateResend;
    if(gateCooldown<=0){ clearInterval(gateTimer); $("#gate-resend").disabled=false; }
  },1000);
}

async function gateSendCode(){
  const m=$("#gate-msg"); m.className="msg";
  const email=$("#gate-email").value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ err("invalid_email"); return; }
  $("#gate-btn").disabled=true; $("#gate-btn").textContent=T().gateSending;
  try{
    await api("/api/games-submit/send-code",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({email}) });
    gateCodeSent=true;
    $("#gate-coderow").style.display="block"; $("#gate-code").focus();
    $("#gate-email").readOnly=true;
    m.className="msg ok"; m.textContent=T().gateSent(email);
    gateStartCooldown();
  }catch(e){ err(e); }
  finally{ $("#gate-btn").disabled=false; $("#gate-btn").textContent=T().gateVerify; }
}

async function gateVerify(){
  const m=$("#gate-msg"); m.className="msg";
  const email=$("#gate-email").value.trim().toLowerCase();
  const code=$("#gate-code").value.trim();
  if(!/^\d{6}$/.test(code)){ err("invalid_input"); return; }
  $("#gate-btn").disabled=true; $("#gate-btn").textContent=T().gateVerifying;
  try{
    const d=await api("/api/games-submit/verify",{ method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({email, code}) });
    clearInterval(gateTimer); $("#gate-resend").style.display="none";
    // 没填过工作室信息 → 先去补全,带回跳参数
    if(!d.studio_name){ location.href="/profile.html?next=submit"; return; }
    showForm(d.studio_name);
  }catch(e){ err(e); $("#gate-btn").disabled=false; $("#gate-btn").textContent=T().gateVerify; }
}

$("#gate-btn").onclick=()=>{ gateCodeSent ? gateVerify() : gateSendCode(); };
$("#gate-resend").onclick=()=>{ if(!$("#gate-resend").disabled) gateSendCode(); };
$("#gate-email").addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&!gateCodeSent) gateSendCode(); });
$("#gate-code").addEventListener("keydown",(e)=>{ if(e.key==="Enter") gateVerify(); });
$("#gate-code").addEventListener("input",()=>{ $("#gate-code").value=$("#gate-code").value.replace(/\D/g,"").slice(0,6); });

(async ()=>{
  renderText();
  try{
    const r=await fetch("/api/auth/me"); const d=await r.json();
    if(d.loggedIn && !d.needsRole && d.role==="developer"){
      let studio="";
      try{ const pr=await fetch("/api/profile/me"); const pd=await pr.json(); if(pd.ok) studio=(pd.profile&&pd.profile.studio_name)||""; }catch(e){}
      if(!studio){ location.href="/profile.html?next=submit"; return; }
      showForm();
    } else if(d.loggedIn && !d.needsRole && d.role==="partner"){
      // 合作方账号:提示换邮箱
      $("#locked-text").textContent=T().lockedRole; $("#locked").style.display="block";
    } else {
      // 未登录 / 未选身份:走邮箱验证建号
      $("#gate").style.display="block";
    }
  }catch(e){
    $("#gate").style.display="block";
  }
})();
</script>
